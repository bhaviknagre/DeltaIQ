apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: delta-chat
  namespace: delta-chat
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"  
spec:
  ingressClassName: nginx
  rules:
    - host: delta-chat.example.com 
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 80
          - path: /grafana
            pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  number: 3000
          - path: /flower
            pathType: Prefix
            backend:
              service:
                name: flower
                port:
                  number: 5555
          - path: /prometheus
            pathType: Prefix
            backend:
              service:
                name: prometheus
                port:
                  number: 9090
