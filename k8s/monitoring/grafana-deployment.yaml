# Deliberately does NOT inline the dashboard JSON/datasource YAML here —
# that content already lives at grafana/provisioning/{datasources,dashboards}/
# at the repo root (used by docker-compose --profile full too). Duplicating
# it into this file would drift the moment either copy is edited and the
# other isn't. Instead, k8s/scripts/deploy.sh generates the
# grafana-dashboards/grafana-datasources ConfigMaps this Deployment mounts,
# directly from those same source files, every time it runs — one source
# of truth, two consumers (compose locally, this Deployment in-cluster).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: delta-chat
  labels:
    app: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana-oss
          ports:
            - containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: { name: delta-chat-secrets, key: GRAFANA_ADMIN_PASSWORD, optional: true }
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: "Viewer"
            # Ingress routes /grafana/* here (see k8s/ingress/ingress.yaml) —
            # without these two, Grafana serves its JS/CSS assets from `/`
            # regardless of the subpath it's actually reached at, and every
            # asset 404s behind the proxy. The classic "Grafana behind an
            # ingress subpath" fix.
            - name: GF_SERVER_ROOT_URL
              value: "%(protocol)s://%(domain)s/grafana/"
            - name: GF_SERVER_SERVE_FROM_SUB_PATH
              value: "true"
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
          readinessProbe:
            httpGet: { path: /api/health, port: 3000 }
            initialDelaySeconds: 5
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
            - name: data
              mountPath: /var/lib/grafana
      volumes:
        - name: datasources
          configMap: { name: grafana-datasources }
        - name: dashboard-provider
          configMap: { name: grafana-dashboard-provider }
        - name: dashboards
          configMap: { name: grafana-dashboards }
        - name: data
          persistentVolumeClaim: { claimName: grafana-data }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-data
  namespace: delta-chat
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: delta-chat
data:
  # Points Grafana's dashboard-loading provider at the mount path above
  # (/var/lib/grafana/dashboards) rather than /etc/grafana/provisioning/
  # dashboards itself — Grafana's file provider expects dashboard JSON in a
  # separate directory from the provider config that points at it.
  dashboards.yml: |
    apiVersion: 1
    providers:
      - name: delta-chat
        orgId: 1
        folder: ""
        type: file
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: delta-chat
spec:
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 3000
