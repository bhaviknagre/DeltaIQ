apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: delta-chat
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    rule_files:
      - /etc/prometheus/alerts.yml
    scrape_configs:
      - job_name: delta-chat
        metrics_path: /metrics
        static_configs:
          - targets: ["api.delta-chat.svc.cluster.local"]
  alerts.yml: |
    groups:
      - name: delta-chat
        rules:
          - alert: DeltaChatDown
            expr: up{job="delta-chat"} == 0
            for: 1m
            labels: { severity: critical }
            annotations:
              summary: "delta-chat target is down"
          - alert: HighHTTPErrorRate
            expr: |
              sum(rate(deltachat_http_requests_total{status=~"5.."}[5m]))
              / sum(rate(deltachat_http_requests_total[5m])) > 0.05
            for: 5m
            labels: { severity: warning }
            annotations:
              summary: "HTTP 5xx rate above 5%"
          - alert: HighRequestLatencyP95
            expr: |
              histogram_quantile(0.95, sum by (path, le) (rate(deltachat_http_request_duration_seconds_bucket[5m]))) > 5
            for: 5m
            labels: { severity: warning }
            annotations:
              summary: "p95 latency above 5s"
          - alert: LLMCallErrorRateHigh
            expr: sum(rate(deltachat_span_errors_total{span_name="llm_call"}[10m])) > 0
            for: 10m
            labels: { severity: warning }
            annotations:
              summary: "LLM provider calls are failing"
          - alert: RequestErrorRateHigh
            expr: |
              sum(rate(deltachat_request_errors_total[10m])) by (kind)
              / sum(rate(deltachat_requests_total[10m])) by (kind) > 0.1
            for: 10m
            labels: { severity: warning }
            annotations:
              summary: "Request error rate above 10%"
