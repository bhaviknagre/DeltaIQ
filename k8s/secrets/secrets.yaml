# TEMPLATE ONLY. Every value below is a placeholder — this file is safe to
# commit (no real secret material) precisely because it never contains any.
# Before actually applying this to a cluster, replace every REPLACE_ME
# value, or better, don't apply this file at all: create the Secret
# imperatively instead so the real values never touch a YAML file on disk —
# same principle as this project's .env (real values) vs .env.example
# (template) split.
#
#   kubectl create secret generic delta-chat-secrets -n delta-chat \
#     --from-literal=GROQ_API_KEY=... \
#     --from-literal=MONGODB_URI='mongodb+srv://user:pass@cluster0.../' \
#     ... (one --from-literal per key below)
#
# Or, for real production use, prefer a managed secret store instead of a
# plain Kubernetes Secret (which is only base64, not encrypted at rest by
# default on most clusters): GCP Secret Manager + the Secret Manager CSI
# driver / External Secrets Operator is the natural fit here since
# terraform/secrets.tf already provisions the Secret Manager entries.
apiVersion: v1
kind: Secret
metadata:
  name: delta-chat-secrets
  namespace: delta-chat
type: Opaque
stringData:
  ANTHROPIC_API_KEY: "REPLACE_ME"
  OPENAI_API_KEY: "REPLACE_ME"
  GROQ_API_KEY: "REPLACE_ME"
  PINECONE_API_KEY: "REPLACE_ME"
  MONGODB_URI: "mongodb+srv://REPLACE_ME:REPLACE_ME@REPLACE_ME.mongodb.net/"
  MINIO_ACCESS_KEY: "REPLACE_ME"
  MINIO_SECRET_KEY: "REPLACE_ME"
  LANGFUSE_PUBLIC_KEY: "REPLACE_ME"
  LANGFUSE_SECRET_KEY: "REPLACE_ME"
