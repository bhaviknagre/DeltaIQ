apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: delta-chat
  labels:
    app: worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: delta-chat:latest  # same image as api/ — see k8s/api/deployment.yaml note
          command: ["celery", "-A", "src.tasks.celery_app", "worker", "--loglevel=info", "--concurrency=2"]
          envFrom:
            - configMapRef: { name: delta-chat-config }
            - secretRef: { name: delta-chat-secrets }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: 1, memory: 2Gi }
          # No HTTP endpoint to probe — a Celery worker's liveness signal is
          # "the process is still running and can talk to the broker."
          livenessProbe:
            exec:
              command: ["celery", "-A", "src.tasks.celery_app", "inspect", "ping", "-d", "celery@$(HOSTNAME)"]
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 10
