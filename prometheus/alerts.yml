groups:
  - name: delta-chat
    rules:
      - alert: DeltaChatDown
        expr: up{job="delta-chat"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "delta-chat target is down"
          description: "Prometheus has not been able to scrape {{ $labels.instance }} for 1 minute."

      - alert: HighHTTPErrorRate
        expr: |
          sum(rate(deltachat_http_requests_total{status=~"5.."}[5m]))
          / sum(rate(deltachat_http_requests_total[5m])) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "HTTP 5xx rate above 5%"
          description: "{{ $value | humanizePercentage }} of requests are failing with a 5xx over the last 5m."

      - alert: HighRequestLatencyP95
        expr: |
          histogram_quantile(0.95, sum by (path, le) (rate(deltachat_http_request_duration_seconds_bucket[5m]))) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "p95 latency on {{ $labels.path }} above 5s"
          description: "p95 request duration for {{ $labels.path }} has been over 5s for 5 minutes."

      - alert: LLMCallErrorRateHigh
        expr: |
          sum(rate(deltachat_span_errors_total{span_name="llm_call"}[10m])) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "LLM provider calls are failing"
          description: "llm_call spans have recorded errors continuously for 10 minutes — check provider status/quota."

      - alert: RequestErrorRateHigh
        expr: |
          sum(rate(deltachat_request_errors_total[10m])) by (kind)
          / sum(rate(deltachat_requests_total[10m])) by (kind) > 0.1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Request error rate above 10% for kind={{ $labels.kind }}"
          description: "More than 10% of '{{ $labels.kind }}' requests have had at least one span error over 10m."
