global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: delta-chat
    metrics_path: /metrics
    static_configs:
      # host.docker.internal: Prometheus runs inside the compose network and
      # scrapes the app wherever it's actually running — natively on the
      # host (`make ui`) is the common case in this project, hence
      # host.docker.internal rather than a compose service name. If running
      # the `ui` service from docker-compose instead, add a second target
      # `ui:8000` here.
      - targets: ["host.docker.internal:8000"]
